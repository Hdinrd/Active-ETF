name: Active ETF daily

on:
  schedule:
    - cron: "0 12 * * 1-5"    # 台北 20:00 (週一到週五)：趕在本機 21:00 打開記事本之前
    - cron: "0 14 * * 1-5"    # 台北 22:00：補抓 20:00 還沒更新的 ETF
    - cron: "30 0 * * 2-6"    # 台北隔天 08:30：再補一次 (冪等，不會重複寫、不會重複推播)
  pull_request:              # PR：完整回補但不寫回 repo，用來驗證 GitHub 機器抓得到 pocket.tw
    paths: ["etf_tracker/**", ".github/workflows/etf-daily.yml"]
  workflow_dispatch:
    inputs:
      backfill:
        description: "回補全部歷史"
        type: boolean
        default: false

concurrency:
  group: etf-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etf_tracker/requirements.txt

      - name: Install
        run: |
          pip install -r etf_tracker/requirements.txt pytest
          python -m playwright install --with-deps chromium

      - name: Tests
        run: python -m pytest etf_tracker/tests -q

      - name: Run pipeline
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m etf_tracker.run --backfill --dry-run --data-dir /tmp/etf_dryrun
            mkdir -p data/reports && cp /tmp/etf_dryrun/reports/latest.md data/reports/ && cp /tmp/etf_dryrun/status.json data/
          elif [ "${{ inputs.backfill }}" = "true" ]; then
            python -m etf_tracker.run --backfill --notify
          else
            python -m etf_tracker.run --notify
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            data/reports/latest.md
            data/status.json
          if-no-files-found: ignore

      - name: Commit data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "etf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: $(TZ=Asia/Taipei date +%F) holdings update"
            git pull --rebase
            git push
          fi
