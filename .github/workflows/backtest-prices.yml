name: Backtest prices

# 在 backtest 分支上 push 時抓回測用的日K，commit 回同一個分支 (不動 main)
on:
  push:
    branches: [backtest]
    paths: ["etf_tracker/prices.py", ".github/workflows/backtest-prices.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas numpy yfinance
      - name: Fetch prices
        run: python -m etf_tracker.prices
      - name: Commit prices
        run: |
          git config user.name "etf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices/
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "data: backtest prices $(TZ=Asia/Taipei date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
